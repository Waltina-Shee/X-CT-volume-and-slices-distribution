<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>灰度相交互归纳工具</title>
<style>
:root{--bg:#f4f5f2;--panel:#fff;--text:#202124;--muted:#66706b;--line:#d8ddd7;--accent:#2f6f68}
*{box-sizing:border-box}body{margin:0;font-family:Microsoft YaHei,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
header{height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#263238;color:white;border-bottom:1px solid #111}h1{font-size:17px;margin:0;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
button,label.file{height:34px;border:1px solid #aeb7b2;background:white;color:#1f2925;border-radius:6px;padding:0 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}header button,header label.file{border-color:#60706a;background:#eff4f2}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.45;cursor:not-allowed}input[type=file]{display:none}input[type=number],input[type=text]{height:32px;border:1px solid #bfc8c2;border-radius:6px;padding:0 8px;background:white;color:var(--text);font-size:13px}input[type=range]{width:130px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 58px);min-height:560px}.stage{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;min-width:0;border-right:1px solid var(--line)}.viewbar{height:50px;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fbfcfa;overflow-x:auto}.viewbar .label,.viewbar input{flex:0 0 auto;white-space:nowrap}.seg{display:inline-flex;border:1px solid #b8c2bc;border-radius:7px;overflow:hidden;flex:0 0 auto}.seg button{border:0;border-right:1px solid #b8c2bc;border-radius:0;height:32px;background:white}.seg button:last-child{border-right:0}.seg button.active{background:#ddebe7;color:#123d37;font-weight:650}.hint,.tiny{font-size:12px;color:var(--muted);white-space:nowrap}.zoomTools{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}.zoomTools button{width:34px;padding:0;justify-content:center}.zoomTools button.fit{width:auto;padding:0 10px}.zoomLabel{width:52px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.canvasWrap{position:relative;overflow:auto;background:linear-gradient(45deg,#d4d7d3 25%,transparent 25%),linear-gradient(-45deg,#d4d7d3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d7d3 75%),linear-gradient(-45deg,transparent 75%,#d4d7d3 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{display:block;margin:24px;box-shadow:0 4px 24px rgba(0,0,0,.18);background:#777;cursor:crosshair;user-select:none}canvas.panning{cursor:grabbing}.status{display:flex;align-items:center;gap:18px;padding:0 12px;background:#fbfcfa;border-top:1px solid var(--line);color:var(--muted);font-size:12px}aside{overflow:auto;background:var(--panel)}.section{padding:14px;border-bottom:1px solid var(--line)}.section h2{font-size:14px;margin:0 0 10px}.drop{border:1px dashed #9aa7a0;border-radius:8px;padding:12px;background:#f8faf8;color:var(--muted);font-size:13px;line-height:1.45}.phaseList{display:flex;flex-direction:column;gap:8px}.phase{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fbfcfa}.phase.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.phaseTop{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}.phaseMeta{color:var(--muted);font-size:12px;margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.phaseTools{display:flex;align-items:center;gap:6px;margin-top:8px}.phaseTools input[type=number]{width:70px}@media(max-width:980px){main{grid-template-columns:1fr;height:auto}aside{min-height:420px}}
</style>
</head>
<body>
<header><h1>灰度相交互归纳工具</h1><div class='toolbar'><label class='file'>上传图片<input id='fileInput' type='file' accept='.tif,.tiff,.png,.jpg,.jpeg,.bmp'></label><button id='addPhase' class='primary'>新增相</button><button id='autoRanges'>自动整理阈值</button><button id='undoBtn' disabled>撤销</button><button id='exportPng'>导出分相图</button><button id='exportPhasePngs'>导出各相分布图</button><button id='exportCsv'>导出阈值 CSV</button><button id='exportJson'>导出工程 JSON</button></div></header>
<main><section class='stage'><div class='viewbar'><div class='seg'><button id='modeGray' class='active'>灰度</button><button id='modeOverlay'>叠加</button><button id='modeMask'>分相</button></div><div class='zoomTools'><button id='zoomOut' title='缩小'>-</button><span id='zoomLabel' class='zoomLabel'>100%</span><button id='zoomIn' title='放大'>+</button><button id='zoomFit' class='fit'>适配</button></div><span class='label tiny'>容差</span><input id='tolerance' type='range' min='1' max='80' value='12'><input id='toleranceNum' type='number' min='1' max='80' value='12'><span class='label tiny'>笔刷</span><input id='brush' type='range' min='1' max='35' value='5'><input id='brushNum' type='number' min='1' max='35' value='5'><span class='hint'>点击采样；Shift+点击只取单点。</span><span class='hint'>滚轮缩放；空格/中键/右键拖拽平移；Ctrl+Z 撤销</span></div><div id='canvasWrap' class='canvasWrap'><canvas id='canvas' width='900' height='580'></canvas></div><div class='status'><span id='imageInfo'>未上传图片</span><span id='cursorInfo'>x -, y -, gray -</span><span id='activeInfo'>当前相：无</span></div></section><aside><div class='section'><h2>工作流</h2><div class='drop'>上传图片后，新增相或直接点击图像创建第一相。每次点击会读取点击区域平均灰度，并用容差形成灰度范围。你可以手动改每个相的灰度上下限、名称和颜色。</div></div><div class='section'><h2>相列表</h2><div id='phaseList' class='phaseList'></div></div><div class='section'><h2>统计</h2><div id='stats' class='tiny'>暂无统计</div></div></aside></main>
<script>
const palette=['#1a3169','#2b4a8e','#3e9684','#ffe884','#f7b546','#d6742d','#ab5627','#622d1a','#d54949','#7b5ea7','#4c8799','#bd6f8a'];
const state={name:'',width:0,height:0,gray:null,imageBitmap:null,phases:[],activeId:null,mode:'gray',scale:1,fitScale:1,undoStack:[]};
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),wrap=document.getElementById('canvasWrap'),fileInput=document.getElementById('fileInput'),phaseList=document.getElementById('phaseList'),statsEl=document.getElementById('stats'),imageInfo=document.getElementById('imageInfo'),cursorInfo=document.getElementById('cursorInfo'),activeInfo=document.getElementById('activeInfo'),tolerance=document.getElementById('tolerance'),toleranceNum=document.getElementById('toleranceNum'),brush=document.getElementById('brush'),brushNum=document.getElementById('brushNum'),undoBtn=document.getElementById('undoBtn'),zoomLabel=document.getElementById('zoomLabel');
function syncPair(a,b){a.addEventListener('input',()=>{b.value=a.value});b.addEventListener('input',()=>{a.value=b.value})}syncPair(tolerance,toleranceNum);syncPair(brush,brushNum);
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}function colorToRgb(hex){const v=hex.replace('#','');return[parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)]}function decodeBase64ToU8(b64){const bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function clonePhases(){return state.phases.map(p=>({id:p.id,name:p.name,color:p.color,min:p.min,max:p.max,samples:[...p.samples]}))}function snapshotState(){return{phases:clonePhases(),activeId:state.activeId}}function updateUndoButton(){undoBtn.disabled=state.undoStack.length===0}function pushUndo(){state.undoStack.push(snapshotState());if(state.undoStack.length>80)state.undoStack.shift();updateUndoButton()}function undo(){const prev=state.undoStack.pop();if(!prev)return;activeEditToken=null;state.phases=prev.phases;state.activeId=prev.activeId;renderPhases();updateStats();render();updateUndoButton()}
async function uploadFile(file){imageInfo.textContent='正在读取图片...';const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(file.name)},body:file});const data=await res.json();if(!res.ok||data.error)throw new Error(data.error||'上传失败');state.name=file.name;state.width=data.width;state.height=data.height;state.gray=decodeBase64ToU8(data.grayBase64);state.phases=[];state.activeId=null;state.undoStack=[];const img=new Image();img.src=data.previewPng;await img.decode();state.imageBitmap=img;fitCanvas();render();renderPhases();updateStats();updateUndoButton();imageInfo.textContent=`${file.name}  ${state.width} x ${state.height}`}
function updateZoomLabel(){zoomLabel.textContent=`${Math.round(state.scale*100)}%`}function setCanvasScale(scale,anchor=null){if(!state.width||!state.height)return;const imageAnchor=anchor?canvasPointFromClient(anchor.clientX,anchor.clientY):null;state.scale=clamp(scale,Math.min(.02,state.fitScale),24);canvas.style.width=`${Math.max(1,Math.round(state.width*state.scale))}px`;canvas.style.height=`${Math.max(1,Math.round(state.height*state.scale))}px`;updateZoomLabel();if(anchor&&imageAnchor){const r=wrap.getBoundingClientRect();wrap.scrollLeft=canvas.offsetLeft+imageAnchor.x*state.scale-(anchor.clientX-r.left);wrap.scrollTop=canvas.offsetTop+imageAnchor.y*state.scale-(anchor.clientY-r.top)}}function fitCanvas(){const maxW=Math.max(420,wrap.clientWidth-52),maxH=Math.max(360,wrap.clientHeight-52);state.fitScale=Math.min(1,maxW/state.width,maxH/state.height);canvas.width=Math.max(1,state.width);canvas.height=Math.max(1,state.height);setCanvasScale(state.fitScale);wrap.scrollLeft=0;wrap.scrollTop=0}
function classify(gray){for(let i=state.phases.length-1;i>=0;i--){const p=state.phases[i];if(gray>=p.min&&gray<=p.max)return p}return null}function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!state.gray||!state.imageBitmap){ctx.fillStyle='#e7e9e4';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#66706b';ctx.font='16px Microsoft YaHei, Segoe UI, sans-serif';ctx.fillText('上传 tif/png/jpg 图片开始',28,42);return}if(state.mode==='gray'){ctx.drawImage(state.imageBitmap,0,0,state.width,state.height);return}const imageData=ctx.createImageData(state.width,state.height),data=imageData.data;for(let i=0;i<state.gray.length;i++){const g=state.gray[i],p=classify(g),o=i*4;if(state.mode==='mask'){if(p){const [r,gg,b]=colorToRgb(p.color);data[o]=r;data[o+1]=gg;data[o+2]=b}else{data[o]=170;data[o+1]=170;data[o+2]=170}}else{if(p){const [r,gg,b]=colorToRgb(p.color);data[o]=Math.round(g*.42+r*.58);data[o+1]=Math.round(g*.42+gg*.58);data[o+2]=Math.round(g*.42+b*.58)}else{data[o]=g;data[o+1]=g;data[o+2]=g}}data[o+3]=255}const off=document.createElement('canvas');off.width=state.width;off.height=state.height;off.getContext('2d').putImageData(imageData,0,0);ctx.drawImage(off,0,0,state.width,state.height)}
function activePhase(){return state.phases.find(p=>p.id===state.activeId)||null}function addPhase(center=null,recordUndo=true){if(recordUndo)pushUndo();const id=crypto.randomUUID(),index=state.phases.length,tol=Number(tolerance.value),mid=center??0;state.phases.push({id,name:`P${index+1}`,color:palette[index%palette.length],min:clamp(mid-tol,0,255),max:clamp(mid+tol,0,255),samples:center==null?[]:[center]});state.activeId=id;renderPhases();updateStats();render()}function removePhase(id){pushUndo();state.phases=state.phases.filter(p=>p.id!==id);if(state.activeId===id)state.activeId=state.phases[0]?.id||null;renderPhases();updateStats();render()}
function sampleGray(cx,cy,radius){if(!state.gray)return null;let sum=0,count=0;for(let y=Math.max(0,cy-radius);y<=Math.min(state.height-1,cy+radius);y++){for(let x=Math.max(0,cx-radius);x<=Math.min(state.width-1,cx+radius);x++){const dx=x-cx,dy=y-cy;if(dx*dx+dy*dy<=radius*radius){sum+=state.gray[y*state.width+x];count++}}}return count?Math.round(sum/count):state.gray[cy*state.width+cx]}function applySample(x,y,onlyPoint){const g=sampleGray(x,y,onlyPoint?0:Number(brush.value));if(g==null)return;pushUndo();let p=activePhase();if(!p){addPhase(g,false);p=activePhase()}const tol=Number(tolerance.value);p.samples.push(g);const mean=Math.round(p.samples.reduce((a,b)=>a+b,0)/p.samples.length);p.min=clamp(Math.min(p.min,g-tol,mean-tol),0,255);p.max=clamp(Math.max(p.max,g+tol,mean+tol),0,255);renderPhases();updateStats();render()}function autoRanges(){if(!state.phases.length)return;pushUndo();state.phases.sort((a,b)=>(a.min+a.max)/2-(b.min+b.max)/2);for(let i=0;i<state.phases.length-1;i++){const l=state.phases[i],r=state.phases[i+1],b=Math.floor(((l.min+l.max)/2+(r.min+r.max)/2)/2);l.max=clamp(b,l.min,255);r.min=clamp(b+1,0,r.max)}renderPhases();updateStats();render()}
let activeEditToken=null;function beginFieldUndo(token){if(activeEditToken===token)return;pushUndo();activeEditToken=token}function endFieldUndo(token){if(activeEditToken===token)activeEditToken=null}function renderPhases(){phaseList.innerHTML='';if(!state.phases.length)phaseList.innerHTML='<div class=tiny>暂无相。点击新增相或直接点击图像创建。</div>';for(const p of state.phases){const el=document.createElement('div');el.className='phase'+(p.id===state.activeId?' active':'');el.innerHTML=`<div class='phaseTop'><input type='color' value='${p.color}'><input type='text' value='${p.name}'><button>删除</button></div><div class='phaseMeta'><span>灰度：<b>${p.min}-${p.max}</b></span><span>采样：${p.samples.length}</span></div><div class='phaseTools'><span class='tiny'>min</span><input type='number' min='0' max='255' value='${p.min}'><span class='tiny'>max</span><input type='number' min='0' max='255' value='${p.max}'><button>选中</button></div>`;const [colorInput,nameInput]=el.querySelectorAll('.phaseTop input'),deleteBtn=el.querySelector('.phaseTop button'),[minInput,maxInput]=el.querySelectorAll('.phaseTools input'),selectBtn=el.querySelector('.phaseTools button');for(const [input,token] of [[colorInput,`${p.id}:color`],[nameInput,`${p.id}:name`],[minInput,`${p.id}:min`],[maxInput,`${p.id}:max`]]){input.addEventListener('focus',()=>beginFieldUndo(token));input.addEventListener('pointerdown',()=>beginFieldUndo(token));input.addEventListener('blur',()=>endFieldUndo(token));input.addEventListener('change',()=>endFieldUndo(token))}colorInput.addEventListener('input',()=>{p.color=colorInput.value;render();updateStats()});nameInput.addEventListener('input',()=>{p.name=nameInput.value;updateActiveInfo()});deleteBtn.addEventListener('click',()=>removePhase(p.id));minInput.addEventListener('input',()=>{p.min=clamp(Number(minInput.value),0,p.max);render();updateStats();updateActiveInfo()});maxInput.addEventListener('input',()=>{p.max=clamp(Number(maxInput.value),p.min,255);render();updateStats();updateActiveInfo()});selectBtn.addEventListener('click',()=>{state.activeId=p.id;renderPhases();updateActiveInfo()});el.addEventListener('click',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;state.activeId=p.id;renderPhases();updateActiveInfo()});phaseList.appendChild(el)}updateActiveInfo()}
function updateActiveInfo(){const p=activePhase();activeInfo.textContent=p?`当前相：${p.name} (${p.min}-${p.max})`:'当前相：无'}function updateStats(){if(!state.gray||!state.phases.length){statsEl.textContent='暂无统计';return}const counts=new Map(state.phases.map(p=>[p.id,0]));let unclassified=0;for(const g of state.gray){const p=classify(g);if(p)counts.set(p.id,counts.get(p.id)+1);else unclassified++}const total=state.gray.length,lines=state.phases.map(p=>{const n=counts.get(p.id);return `${p.name} ${p.min}-${p.max}: ${n} 像素，${(n/total*100).toFixed(3)}%`});lines.push(`未归类: ${unclassified} 像素，${(unclassified/total*100).toFixed(3)}%`);statsEl.innerHTML=lines.map(s=>`<div>${s}</div>`).join('')}
function canvasPointFromClient(clientX,clientY){const r=canvas.getBoundingClientRect();return{x:clamp(Math.floor((clientX-r.left)*state.width/r.width),0,state.width-1),y:clamp(Math.floor((clientY-r.top)*state.height/r.height),0,state.height-1)}}function canvasPoint(e){return canvasPointFromClient(e.clientX,e.clientY)}canvas.addEventListener('mousemove',e=>{if(!state.gray)return;const {x,y}=canvasPoint(e),g=state.gray[y*state.width+x];cursorInfo.textContent=`x ${x}, y ${y}, gray ${g}`});canvas.addEventListener('click',e=>{if(!state.gray)return;if(suppressNextClick){suppressNextClick=false;return}const {x,y}=canvasPoint(e);applySample(x,y,e.shiftKey)});
let isPanning=false,suppressNextClick=false,spaceDown=false,panStart={x:0,y:0,scrollLeft:0,scrollTop:0};function startPan(e){isPanning=true;suppressNextClick=true;panStart={x:e.clientX,y:e.clientY,scrollLeft:wrap.scrollLeft,scrollTop:wrap.scrollTop};canvas.classList.add('panning');e.preventDefault()}canvas.addEventListener('mousedown',e=>{if(!state.gray)return;if(spaceDown||e.button===1||e.button===2)startPan(e)});window.addEventListener('mousemove',e=>{if(!isPanning)return;wrap.scrollLeft=panStart.scrollLeft-(e.clientX-panStart.x);wrap.scrollTop=panStart.scrollTop-(e.clientY-panStart.y)});window.addEventListener('mouseup',()=>{if(!isPanning)return;isPanning=false;canvas.classList.remove('panning')});canvas.addEventListener('contextmenu',e=>e.preventDefault());wrap.addEventListener('wheel',e=>{if(!state.gray)return;e.preventDefault();setCanvasScale(state.scale*(e.deltaY<0?1.15:1/1.15),{clientX:e.clientX,clientY:e.clientY})},{passive:false});
fileInput.addEventListener('change',async()=>{const file=fileInput.files[0];if(!file)return;try{await uploadFile(file)}catch(err){alert(err.message);imageInfo.textContent='读取失败'}});document.getElementById('addPhase').addEventListener('click',()=>addPhase());document.getElementById('autoRanges').addEventListener('click',autoRanges);undoBtn.addEventListener('click',undo);document.getElementById('zoomOut').addEventListener('click',()=>setCanvasScale(state.scale/1.25));document.getElementById('zoomIn').addEventListener('click',()=>setCanvasScale(state.scale*1.25));document.getElementById('zoomFit').addEventListener('click',fitCanvas);window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){spaceDown=true;e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}});window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});for(const [id,mode] of [['modeGray','gray'],['modeOverlay','overlay'],['modeMask','mask']])document.getElementById(id).addEventListener('click',()=>{state.mode=mode;for(const btn of document.querySelectorAll('.seg button'))btn.classList.remove('active');document.getElementById(id).classList.add('active');render()});
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function safeName(v){return String(v||'phase').trim().replaceAll(' ','_').slice(0,80)||'phase'}function makeMaskCanvas(phase=null){const c=document.createElement('canvas');c.width=state.width;c.height=state.height;const ectx=c.getContext('2d'),imageData=ectx.createImageData(state.width,state.height),data=imageData.data;for(let i=0;i<state.gray.length;i++){const p=classify(state.gray[i]),o=i*4;if(phase){if(p?.id===phase.id){const rgb=colorToRgb(phase.color);data[o]=rgb[0];data[o+1]=rgb[1];data[o+2]=rgb[2];data[o+3]=255}else{data[o]=255;data[o+1]=255;data[o+2]=255;data[o+3]=0}}else{const rgb=p?colorToRgb(p.color):[170,170,170];data[o]=rgb[0];data[o+1]=rgb[1];data[o+2]=rgb[2];data[o+3]=255}}ectx.putImageData(imageData,0,0);return c}document.getElementById('exportPng').addEventListener('click',()=>{if(!state.gray)return;makeMaskCanvas().toBlob(blob=>downloadBlob(blob,`${state.name||'phase'}_segmentation.png`))});document.getElementById('exportPhasePngs').addEventListener('click',()=>{if(!state.gray||!state.phases.length)return;const base=safeName((state.name||'phase').replace(/\.[^.]+$/,''));for(const p of state.phases)makeMaskCanvas(p).toBlob(blob=>downloadBlob(blob,`${base}_${safeName(p.name)}_distribution.png`))});document.getElementById('exportCsv').addEventListener('click',()=>{if(!state.gray)return;const rows=[['phase','gray_min','gray_max','color_hex','samples','pixels','area_percent']],counts=new Map(state.phases.map(p=>[p.id,0]));for(const g of state.gray){const p=classify(g);if(p)counts.set(p.id,counts.get(p.id)+1)}for(const p of state.phases){const n=counts.get(p.id);rows.push([p.name,p.min,p.max,p.color,p.samples.join('|'),n,(n/state.gray.length*100).toFixed(6)])}const q=String.fromCharCode(34),csv=rows.map(row=>row.map(v=>q+String(v).replaceAll(q,q+q)+q).join(',')).join('\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`${state.name||'phase'}_thresholds.csv`)});document.getElementById('exportJson').addEventListener('click',()=>{const project={image:{name:state.name,width:state.width,height:state.height},phases:state.phases,exportedAt:new Date().toISOString()};downloadBlob(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),`${state.name||'phase'}_project.json`)});window.addEventListener('resize',()=>{if(!state.gray)return;fitCanvas();render()});render();renderPhases();updateUndoButton();updateZoomLabel();
</script>
</body>
</html>
